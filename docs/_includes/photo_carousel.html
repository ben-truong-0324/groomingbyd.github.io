<section class="testimonies-section" id="testimonies">
    <section class="testimonies-section" id="testimonies">
        <h2 class="section-title">Grooming Gallery</h2>

        <div class="photo-grid-scroll">
            <div class="testimony-card" style="text-align: center;">
                <video style="width:100%; height:250px; border-radius:10px; object-fit:cover; margin-bottom: 10px; border: 2px solid var(--black);" 
                    controls 
                    muted 
                    playsinline>
                    <source src="{{ '/assets/images/vid1.MOV' }}" type="video/mp4">
                </video>
            </div>
            <div class="testimony-card" style="text-align: center;">
                <video style="width:100%; height:250px; border-radius:10px; object-fit:cover; margin-bottom: 10px; border: 2px solid var(--black);" 
                    controls 
                    muted 
                    playsinline>
                    <source src="{{ '/assets/images/vid3.MOV' }}" type="video/mp4">
                </video>
            </div>
            
            {% for i in (14..47) reversed %}
            <div class="testimony-card" style="text-align: center;">
                <img src="{{ '/assets/images/gbd' | append: i | append: '.JPG' }}" 
                    style="width:100%; height:250px; border-radius:10px; object-fit:cover; margin-bottom: 10px; border: 2px solid var(--black);" 
                    alt="Grooming Transformation">
            </div>
            {% endfor %}
            {% for i in (1..13) %}
            <div class="testimony-card" style="text-align: center;">
                <img src="{{ '/assets/images/gbd' | append: i | append: '.jpg' }}" 
                    style="width:100%; height:250px; border-radius:10px; object-fit:cover; margin-bottom: 10px; border: 2px solid var(--black);" 
                    alt="Grooming Transformation">
            </div>
            {% endfor %}
            {% for i in (80..80) %}
            <div class="testimony-card" style="text-align: center;">
                <img src="{{ '/assets/images/gbd' | append: i | append: '.png' }}" 
                    style="width:100%; height:250px; border-radius:10px; object-fit:cover; margin-bottom: 10px; border: 2px solid var(--black);" 
                    alt="Grooming Transformation">
            </div>
            {% endfor %}
            <div class="testimony-card" style="text-align: center;">
                <video style="width:100%; height:250px; border-radius:10px; object-fit:cover; margin-bottom: 10px; border: 2px solid var(--black);" 
                    controls 
                    muted 
                    playsinline>
                    <source src="{{ '/assets/images/vid4.mov' }}" type="video/mp4">
                </video>
            </div>
            <div class="testimony-card" style="text-align: center;">
                <video style="width:100%; height:250px; border-radius:10px; object-fit:cover; margin-bottom: 10px; border: 2px solid var(--black);" 
                    controls 
                    muted 
                    playsinline>
                    <source src="{{ '/assets/images/vid5.mov' }}" type="video/mp4">
                </video>
            </div>
            <div class="testimony-card" style="text-align: center;">
                <video style="width:100%; height:250px; border-radius:10px; object-fit:cover; margin-bottom: 10px; border: 2px solid var(--black);" 
                    controls 
                    muted 
                    playsinline>
                    <source src="{{ '/assets/images/vid6.mov' }}" type="video/mp4">
                </video>
            </div>
        </div>
    </section>
</section>
